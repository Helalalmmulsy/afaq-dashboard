<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#112A46"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="30%" stop-color="#F5B938"/>
      <stop offset="70%" stop-color="#D49216"/>
      <stop offset="100%" stop-color="#9E6800"/>
    </linearGradient>

    <!-- Pale Gold Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDA01B"/>
      <stop offset="50%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#C68814"/>
    </linearGradient>

    <!-- Architectural Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F254B"/>
    </linearGradient>

    <!-- Cyan Horizon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Deep Tower Shading -->
    <linearGradient id="towerDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C1B33"/>
      <stop offset="100%" stop-color="#162E56"/>
    </linearGradient>

    <linearGradient id="towerLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#255299"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowEmblem" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E5FF" flood-opacity="0.15"/>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for Squircle -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background Base Container -->
  <g clip-path="url(#squircleClip)">
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle Engineering Blueprint Grid -->
    <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="128" y1="0" x2="128" y2="1024"/>
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="384" y1="0" x2="384" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024" stroke-width="2.5"/>
      <line x1="640" y1="0" x2="640" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="896" y1="0" x2="896" y2="1024"/>
      <line x1="0" y1="128" x2="1024" y2="128"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="384" x2="1024" y2="384"/>
      <line x1="0" y1="512" x2="1024" y2="512" stroke-width="2.5"/>
      <line x1="0" y1="640" x2="1024" y2="640"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <line x1="0" y1="896" x2="1024" y2="896"/>
      <!-- Blueprint Circles -->
      <circle cx="512" cy="480" r="320" fill="none"/>
      <circle cx="512" cy="480" r="440" fill="none" stroke-dasharray="8 8"/>
    </g>

    <!-- Radial Glow Behind Emblem -->
    <circle cx="512" cy="460" r="320" fill="#0284C7" opacity="0.12" filter="url(#glowGold)"/>
    <circle cx="512" cy="440" r="180" fill="#F5B938" opacity="0.08" filter="url(#glowGold)"/>

    <!-- Subtle Inner Border Highlight -->
    <rect x="12" y="12" width="1000" height="1000" rx="212" ry="212" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.35"/>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- MAIN ARCHITECTURAL EMBLEM                           -->
    <!-- ═══════════════════════════════════════════════════ -->
    <g filter="url(#shadowEmblem)">

      <!-- OUTER PENTAGON FRAME (The Gabled House / Architectural Crest) -->
      <!-- Outer Golden Rim -->
      <polygon points="512,130 840,350 760,770 264,770 184,350"
               fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linejoin="round"/>

      <!-- Inner Royal Blue Accent Border -->
      <polygon points="512,154 818,360 744,750 280,750 206,360"
               fill="#0A1C33" stroke="url(#cyanGrad)" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>

      <!-- ─── TOWER STRUCTURES (Precision Skyscraper Silhouette) ─── -->

      <!-- Back Left Support Tower -->
      <polygon points="270,740 270,440 340,400 340,740" fill="url(#towerDark)"/>
      <polygon points="340,400 340,740 360,740 360,410" fill="url(#towerLight)"/>

      <!-- Back Right Support Tower -->
      <polygon points="664,410 664,740 684,740 684,400" fill="url(#towerDark)"/>
      <polygon points="684,400 684,740 754,740 754,440" fill="url(#towerLight)"/>

      <!-- Middle Left Tower -->
      <polygon points="360,740 360,340 435,300 435,740" fill="url(#towerDark)"/>
      <polygon points="435,300 435,740 455,740 455,310" fill="url(#towerLight)"/>

      <!-- Middle Right Tower -->
      <polygon points="569,310 569,740 589,740 589,300" fill="url(#towerDark)"/>
      <polygon points="589,300 589,740 664,740 664,340" fill="url(#towerLight)"/>

      <!-- CENTER APEX TOWER (The Pinnacle - Symbolizing "Afaq") -->
      <polygon points="460,740 460,240 512,200 512,740" fill="url(#blueGrad)"/>
      <polygon points="512,200 512,740 564,740 564,240" fill="url(#towerLight)"/>

      <!-- Tower Center Highlight Rib -->
      <line x1="512" y1="200" x2="512" y2="740" stroke="url(#goldLight)" stroke-width="4"/>

      <!-- Architectural Grid Lines on Center Tower (Windows / Structural Modules) -->
      <g stroke="url(#cyanGrad)" stroke-width="2" opacity="0.7">
        <line x1="470" y1="280" x2="554" y2="280"/>
        <line x1="470" y1="330" x2="554" y2="330"/>
        <line x1="470" y1="380" x2="554" y2="380"/>
        <line x1="470" y1="430" x2="554" y2="430"/>
        <line x1="470" y1="480" x2="554" y2="480"/>
        <line x1="470" y1="530" x2="554" y2="530"/>
        <line x1="470" y1="580" x2="554" y2="580"/>
        <line x1="470" y1="630" x2="554" y2="630"/>
        <line x1="470" y1="680" x2="554" y2="680"/>
      </g>

      <!-- Side Towers Grid Lines -->
      <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
        <line x1="370" y1="380" x2="445" y2="380"/>
        <line x1="370" y1="440" x2="445" y2="440"/>
        <line x1="370" y1="500" x2="445" y2="500"/>
        <line x1="579" y1="380" x2="654" y2="380"/>
        <line x1="579" y1="440" x2="654" y2="440"/>
        <line x1="579" y1="500" x2="654" y2="500"/>
      </g>

      <!-- Structural Cross-Braces (Engineering Trusses) -->
      <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.35">
        <line x1="270" y1="460" x2="340" y2="540"/>
        <line x1="270" y1="540" x2="340" y2="460"/>
        <line x1="684" y1="460" x2="754" y2="540"/>
        <line x1="684" y1="540" x2="754" y2="460"/>
      </g>

      <!-- ─── DYNAMIC HORIZON SWEEPS (The "Afaq" Arcs) ─── -->

      <!-- Lower Gold Arc (Quality & Groundwork) -->
      <path d="M 230,730 C 320,620 440,510 590,490 C 670,480 750,510 820,560
               C 740,530 670,510 590,520 C 430,540 320,650 250,740 Z"
            fill="url(#goldGrad)"/>

      <!-- Upper Cyan Arc (Vision & Horizon) -->
      <path d="M 210,690 C 320,540 450,430 630,420 C 720,415 790,440 850,480
               C 780,450 710,435 630,440 C 460,450 340,570 230,710 Z"
            fill="url(#cyanGrad)"/>

      <!-- Foundation Plinth Base -->
      <rect x="240" y="750" width="544" height="20" rx="4" fill="url(#goldGrad)"/>
      <line x1="240" y1="750" x2="784" y2="750" stroke="#FFE885" stroke-width="2"/>
    </g>

    <!-- ─── REFINED BOTTOM BRAND TITLE (Integrated on Icon) ─── -->
    <!-- Gold Divider Accent Line -->
    <path d="M 360,820 L 512,820 L 664,820" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="512,814 518,820 512,826 506,820" fill="#FFE885"/>

    <!-- Arabic Brand Typography -->
    <text x="512" y="878"
          font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif"
          font-size="46"
          font-weight="900"
          text-anchor="middle"
          fill="#FFFFFF"
          letter-spacing="1">
      آفــاق العــرب
    </text>

    <!-- Subtitle: Engineering & Contracting -->
    <text x="512" y="918"
          font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif"
          font-size="19"
          font-weight="700"
          text-anchor="middle"
          fill="url(#goldGrad)"
          letter-spacing="2">
      للاستشارات الهندسية والمقاولات
    </text>

    <!-- English Quality Tagline -->
    <text x="512" y="948"
          font-family="'Cairo', 'Segoe UI', Arial, sans-serif"
          font-size="12"
          font-weight="600"
          text-anchor="middle"
          fill="#7DD3FC"
          letter-spacing="4"
          opacity="0.85">
      PRECISION &amp; QUALITY
    </text>

  </g>
</svg>