<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="30%" stop-color="#F5B938"/>
      <stop offset="70%" stop-color="#D49216"/>
      <stop offset="100%" stop-color="#9E6800"/>
    </linearGradient>

    <!-- Pale Gold Gradient -->
    <linearGradient id="goldLightD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDA01B"/>
      <stop offset="50%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#C68814"/>
    </linearGradient>

    <!-- Architectural Royal Blue Gradient -->
    <linearGradient id="blueGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F254B"/>
    </linearGradient>

    <!-- Cyan Horizon Gradient -->
    <linearGradient id="cyanGradD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Deep Tower Shading -->
    <linearGradient id="towerDarkD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C1B33"/>
      <stop offset="100%" stop-color="#162E56"/>
    </linearGradient>

    <linearGradient id="towerLightD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#255299"/>
    </linearGradient>

    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: THE ICONIC EMBLEM                       -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g transform="translate(1380, 25) scale(0.58)" filter="url(#shadowD)">
    <polygon points="512,60 860,300 774,740 250,740 164,300"
             fill="none" stroke="url(#goldGradD)" stroke-width="22" stroke-linejoin="round"/>

    <polygon points="512,86 836,310 756,720 268,720 188,310"
             fill="#0B192C" stroke="url(#cyanGradD)" stroke-width="6" stroke-linejoin="round"/>

    <polygon points="256,710 256,410 330,370 330,710" fill="url(#towerDarkD)"/>
    <polygon points="330,370 330,710 350,710 350,380" fill="url(#towerLightD)"/>
    <polygon points="674,380 674,710 694,710 694,370" fill="url(#towerDarkD)"/>
    <polygon points="694,370 694,710 768,710 768,410" fill="url(#towerLightH)"/>
    <polygon points="350,710 350,310 430,270 430,710" fill="url(#towerDarkD)"/>
    <polygon points="430,270 430,710 450,710 450,280" fill="url(#towerLightD)"/>
    <polygon points="574,280 574,710 594,710 594,270" fill="url(#towerDarkD)"/>
    <polygon points="594,270 594,710 674,710 674,310" fill="url(#towerLightD)"/>

    <polygon points="455,710 455,200 512,150 512,710" fill="url(#blueGradD)"/>
    <polygon points="512,150 512,710 569,710 569,200" fill="url(#towerLightD)"/>
    <line x1="512" y1="150" x2="512" y2="710" stroke="url(#goldLightD)" stroke-width="5"/>

    <g stroke="url(#cyanGradD)" stroke-width="3" opacity="0.85">
      <line x1="465" y1="240" x2="559" y2="240"/>
      <line x1="465" y1="290" x2="559" y2="290"/>
      <line x1="465" y1="340" x2="559" y2="340"/>
      <line x1="465" y1="390" x2="559" y2="390"/>
      <line x1="465" y1="440" x2="559" y2="440"/>
      <line x1="465" y1="490" x2="559" y2="490"/>
      <line x1="465" y1="540" x2="559" y2="540"/>
      <line x1="465" y1="590" x2="559" y2="590"/>
      <line x1="465" y1="640" x2="559" y2="640"/>
    </g>

    <g stroke="#38BDF8" stroke-width="2" opacity="0.5">
      <line x1="360" y1="350" x2="440" y2="350"/>
      <line x1="360" y1="410" x2="440" y2="410"/>
      <line x1="360" y1="470" x2="440" y2="470"/>
      <line x1="584" y1="350" x2="664" y2="350"/>
      <line x1="584" y1="410" x2="664" y2="410"/>
      <line x1="584" y1="470" x2="664" y2="470"/>
    </g>

    <g stroke="url(#goldGradD)" stroke-width="3" opacity="0.4">
      <line x1="256" y1="430" x2="330" y2="510"/>
      <line x1="256" y1="510" x2="330" y2="430"/>
      <line x1="694" y1="430" x2="768" y2="510"/>
      <line x1="694" y1="510" x2="768" y2="430"/>
    </g>

    <path d="M 215,700 C 310,580 435,460 595,440 C 680,430 765,460 840,510
             C 755,480 680,460 595,470 C 425,490 310,610 235,710 Z"
          fill="url(#goldGradD)"/>
    <path d="M 195,660 C 310,500 445,380 635,370 C 730,365 805,390 870,430
             C 795,400 720,385 635,390 C 455,400 330,530 215,680 Z"
          fill="url(#cyanGradD)"/>

    <rect x="220" y="720" width="584" height="24" rx="4" fill="url(#goldGradD)"/>
    <line x1="220" y1="720" x2="804" y2="720" stroke="#FFE885" stroke-width="3"/>
  </g>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT/CENTER: ARABIC & ENGLISH BRAND TYPOGRAPHY     -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g transform="translate(1330, 0)">
    <text x="0" y="155"
          font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif"
          font-size="108"
          font-weight="900"
          text-anchor="end"
          letter-spacing="0">
      <tspan fill="#FFFFFF">آفـــاق </tspan>
      <tspan fill="#38BDF8">العـــرب</tspan>
    </text>

    <path d="M 0,190 L -1200,190" stroke="url(#goldGradD)" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="0,183 12,190 0,197 -12,190" fill="#F5B938"/>

    <text x="0" y="255"
          font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif"
          font-size="39"
          font-weight="800"
          text-anchor="end"
          fill="#E2E8F0"
          letter-spacing="0.5">
      للاستشارات الهندسية والمقاولات العامة والتطوير العقاري
    </text>

    <text x="0" y="315"
          font-family="'Cairo', 'Segoe UI', Arial, sans-serif"
          font-size="22"
          font-weight="800"
          text-anchor="end"
          fill="#38BDF8"
          letter-spacing="4">
      AFAQ AL-ARAB • ENGINEERING &amp; CONTRACTING
    </text>

    <g transform="translate(-600, 390)">
      <rect x="-310" y="-32" width="620" height="46" rx="23" fill="#1E293B"/>
      <rect x="-308" y="-30" width="616" height="42" rx="21" fill="none" stroke="url(#goldGradD)" stroke-width="2"/>
      <text x="0" y="0"
            font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif"
            font-size="21"
            font-weight="700"
            text-anchor="middle"
            fill="#FFE885"
            letter-spacing="1">
        ✦ دقة التصميم .. وجودة التنفيذ ✦
      </text>
    </g>
  </g>
</svg>