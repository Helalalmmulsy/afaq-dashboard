<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="30%" stop-color="#F5B938"/>
      <stop offset="70%" stop-color="#D49216"/>
      <stop offset="100%" stop-color="#9E6800"/>
    </linearGradient>

    <!-- Pale Gold Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDA01B"/>
      <stop offset="50%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#C68814"/>
    </linearGradient>

    <!-- Architectural Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F254B"/>
    </linearGradient>

    <!-- Cyan Horizon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Deep Tower Shading -->
    <linearGradient id="towerDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C1B33"/>
      <stop offset="100%" stop-color="#162E56"/>
    </linearGradient>

    <linearGradient id="towerLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#255299"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowEmblem" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(-112, -40)" filter="url(#shadowEmblem)">
    <!-- OUTER PENTAGON FRAME (The Gabled House / Crest) -->
    <!-- Outer Golden Rim -->
    <polygon points="512,130 840,350 760,770 264,770 184,350"
             fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linejoin="round"/>

    <!-- Inner Royal Blue Accent Border -->
    <polygon points="512,154 818,360 744,750 280,750 206,360"
             fill="#0F2440" stroke="url(#cyanGrad)" stroke-width="5" stroke-linejoin="round"/>

    <!-- ─── TOWER STRUCTURES (Skyscrapers) ─── -->
    <!-- Back Left Support Tower -->
    <polygon points="270,740 270,440 340,400 340,740" fill="url(#towerDark)"/>
    <polygon points="340,400 340,740 360,740 360,410" fill="url(#towerLight)"/>

    <!-- Back Right Support Tower -->
    <polygon points="664,410 664,740 684,740 684,400" fill="url(#towerDark)"/>
    <polygon points="684,400 684,740 754,740 754,440" fill="url(#towerLight)"/>

    <!-- Middle Left Tower -->
    <polygon points="360,740 360,340 435,300 435,740" fill="url(#towerDark)"/>
    <polygon points="435,300 435,740 455,740 455,310" fill="url(#towerLight)"/>

    <!-- Middle Right Tower -->
    <polygon points="569,310 569,740 589,740 589,300" fill="url(#towerDark)"/>
    <polygon points="589,300 589,740 664,740 664,340" fill="url(#towerLight)"/>

    <!-- CENTER APEX TOWER (The Pinnacle - Symbolizing "Afaq") -->
    <polygon points="460,740 460,240 512,200 512,740" fill="url(#blueGrad)"/>
    <polygon points="512,200 512,740 564,740 564,240" fill="url(#towerLight)"/>

    <!-- Tower Center Highlight Rib -->
    <line x1="512" y1="200" x2="512" y2="740" stroke="url(#goldLight)" stroke-width="4"/>

    <!-- Architectural Grid Lines on Center Tower -->
    <g stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.8">
      <line x1="470" y1="280" x2="554" y2="280"/>
      <line x1="470" y1="330" x2="554" y2="330"/>
      <line x1="470" y1="380" x2="554" y2="380"/>
      <line x1="470" y1="430" x2="554" y2="430"/>
      <line x1="470" y1="480" x2="554" y2="480"/>
      <line x1="470" y1="530" x2="554" y2="530"/>
      <line x1="470" y1="580" x2="554" y2="580"/>
      <line x1="470" y1="630" x2="554" y2="630"/>
      <line x1="470" y1="680" x2="554" y2="680"/>
    </g>

    <!-- Side Towers Grid Lines -->
    <g stroke="#38BDF8" stroke-width="1.5" opacity="0.5">
      <line x1="370" y1="380" x2="445" y2="380"/>
      <line x1="370" y1="440" x2="445" y2="440"/>
      <line x1="370" y1="500" x2="445" y2="500"/>
      <line x1="579" y1="380" x2="654" y2="380"/>
      <line x1="579" y1="440" x2="654" y2="440"/>
      <line x1="579" y1="500" x2="654" y2="500"/>
    </g>

    <!-- Structural Cross-Braces -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4">
      <line x1="270" y1="460" x2="340" y2="540"/>
      <line x1="270" y1="540" x2="340" y2="460"/>
      <line x1="684" y1="460" x2="754" y2="540"/>
      <line x1="684" y1="540" x2="754" y2="460"/>
    </g>

    <!-- ─── DYNAMIC HORIZON SWEEPS ─── -->
    <!-- Lower Gold Arc -->
    <path d="M 230,730 C 320,620 440,510 590,490 C 670,480 750,510 820,560
             C 740,530 670,510 590,520 C 430,540 320,650 250,740 Z"
          fill="url(#goldGrad)"/>

    <!-- Upper Cyan Arc -->
    <path d="M 210,690 C 320,540 450,430 630,420 C 720,415 790,440 850,480
             C 780,450 710,435 630,440 C 460,450 340,570 230,710 Z"
          fill="url(#cyanGrad)"/>

    <!-- Foundation Base -->
    <rect x="240" y="750" width="544" height="22" rx="4" fill="url(#goldGrad)"/>
    <line x1="240" y1="750" x2="784" y2="750" stroke="#FFE885" stroke-width="2.5"/>
  </g>
</svg>